[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "listing-watcher"
version = "0.1.0"
description = "Chat with a browser agent that finds and compares listings (Mercari, SUUMO, ...)"
requires-python = ">=3.11"
dependencies = [
    "browser-use==1.0.5",
    "python-dotenv==1.2.4",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "langgraph==1.2.22",
    "mcp==2.3.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0"]

[project.scripts]
listing-watcher = "watcher.cli:main"
listing-watcher-mcp = "watcher.mcp_server:main"

[tool.setuptools]
packages = ["watcher"]

[tool.setuptools.package-data]
watcher = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
markers = ["live: hits the real shop sites (run with -m live)"]
