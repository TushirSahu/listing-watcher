[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "listing-watcher"
version = "0.1.0"
description = "Browser agent that watches listing sites and alerts you on new matches"
requires-python = ">=3.11"
dependencies = ["browser-use==1.0.5", "pyyaml", "python-dotenv", "certifi"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
listing-watcher = "watcher.cli:main"

[tool.setuptools]
packages = ["watcher"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
