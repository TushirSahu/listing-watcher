<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>listing-watcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1d2433;
    --paper: #eef1f4;
    --receipt: #fbfbf8;
    --tag-yellow: #ffd23f;
    --hanko: #d6342f;
    --muted: #6b7385;
    --surface: #ffffff;
    --line: #d5dae2;
    --text: var(--ink);
    --display: "Dela Gothic One", "Hiragino Sans", sans-serif;
    --body: "IBM Plex Sans JP", "Hiragino Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #12151c; --surface: #1a1f2a; --line: #2b3242; --text: #e8ebf0; --muted: #9aa3b5; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--text);
    font: 15px/1.55 var(--body);
    display: grid; grid-template-rows: auto 1fr;
  }
  :focus-visible { outline: 2px solid var(--hanko); outline-offset: 2px; }
  button { font: inherit; cursor: pointer; }

  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 24px; border-bottom: 1px solid var(--line);
  }
  .wordmark { font-family: var(--display); font-weight: 400; font-size: 20px; letter-spacing: .02em; margin: 0; }
  .wordmark span { color: var(--hanko); }
  .status { font: 500 12px var(--mono); color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status.busy::before { background: var(--hanko); animation: pulse 1s infinite alternate; }
  .status.offline { color: var(--hanko); }
  .new-search {
    margin-left: auto; background: none; color: var(--text);
    border: 1.5px solid var(--text); border-radius: 999px; padding: 6px 16px; font-weight: 500;
  }
  .new-search:disabled { opacity: .4; cursor: not-allowed; }

  main { display: grid; grid-template-columns: minmax(320px, 420px) 1fr; min-height: 0; }

  .chat { display: grid; grid-template-rows: 1fr auto; border-right: 1px solid var(--line); min-height: 0; }
  .log { overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
  .msg .who { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
  .msg p { margin: 4px 0 0; white-space: pre-wrap; }
  .msg.you p { font-weight: 500; }
  .msg.agent.error p { color: var(--hanko); }
  .msg .count { font: 12px var(--mono); color: var(--muted); margin-top: 4px; }
  .composer { display: flex; gap: 8px; padding: 16px 24px 20px; border-top: 1px solid var(--line); }
  .composer textarea {
    flex: 1; resize: none; height: 64px; padding: 10px 12px;
    font: inherit; color: var(--text); background: var(--surface);
    border: 1.5px solid var(--line); border-radius: 10px;
  }
  .composer textarea:focus { border-color: var(--text); outline: none; }
  .composer button {
    align-self: stretch; padding: 0 20px; border: 0; border-radius: 10px;
    background: var(--ink); color: #fff; font-weight: 700;
  }
  @media (prefers-color-scheme: dark) { .composer button { background: var(--tag-yellow); color: var(--ink); } }
  .composer button:disabled, .composer textarea:disabled { opacity: .5; cursor: not-allowed; }

  .board { overflow-y: auto; padding: 24px 28px 40px; display: grid; gap: 28px; align-content: start; }

  /* signature 1: the receipt the agent prints while it works */
  .receipt {
    background: var(--receipt); color: var(--ink); max-width: 460px;
    font: 13px/1.7 var(--mono); padding: 16px 20px 26px;
    filter: drop-shadow(0 6px 10px rgba(29,36,51,.18));
    -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 14px 100%;
            mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 14px 100%;
  }
  .receipt h2 {
    margin: 0 0 8px; font: 500 12px var(--mono); letter-spacing: .14em; text-transform: uppercase;
    display: flex; justify-content: space-between; border-bottom: 1px dashed #b9bfca; padding-bottom: 8px;
  }
  .receipt ol { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow-y: auto; }
  .receipt li { animation: print .28s ease-out both; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .receipt .idle { color: #7b8292; white-space: normal; }
  .receipt .total { border-top: 1px dashed #b9bfca; margin-top: 8px; padding-top: 6px; display: flex; justify-content: space-between; }

  /* signature 2: results as 値札 price tags */
  .tags-head h2 { font: 500 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 22px; }
  .tags { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 30px 20px; }
  .tag {
    position: relative; background: var(--receipt); color: var(--ink);
    border-radius: 6px 6px 10px 10px; padding: 34px 14px 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 10px 22px -14px rgba(29,36,51,.45);
    display: flex; flex-direction: column; gap: 8px;
    animation: hang .5s cubic-bezier(.3,1.4,.5,1) both;
    transform-origin: 50% 0;
  }
  .tag::before {
    content: ""; position: absolute; top: 11px; left: 50%; width: 12px; height: 12px; margin-left: -6px;
    border-radius: 50%; background: var(--paper); box-shadow: inset 0 1px 2px rgba(0,0,0,.35);
  }
  .tag::after {
    content: ""; position: absolute; top: -16px; left: 50%; width: 1.5px; height: 28px;
    background: #b9a98a; transform: rotate(14deg); transform-origin: bottom;
  }
  .tag .hanko {
    position: absolute; top: 8px; right: 10px; width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid var(--hanko); color: var(--hanko);
    font: 15px/30px var(--display); text-align: center; transform: rotate(-12deg); opacity: .9;
  }
  .tag .photo {
    aspect-ratio: 4 / 3; border-radius: 4px; overflow: hidden;
    background: repeating-linear-gradient(-45deg, #eceef1 0 8px, #f5f6f8 8px 16px);
    display: grid; place-items: center; font: 12px var(--mono); color: #8b92a1;
  }
  .tag .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tag .price { font: 26px/1.1 var(--display); letter-spacing: .01em; }
  .tag .price small { font-size: .55em; margin-right: 2px; }
  .tag .cheapest {
    align-self: flex-start; background: var(--tag-yellow); color: var(--ink);
    font: 700 11px var(--body); padding: 2px 8px; border-radius: 3px; transform: rotate(-2deg);
  }
  .tag .title { font-weight: 700; font-size: 14px; line-height: 1.35; margin: 0;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tag .why { font-size: 13px; color: #4a5263; margin: 0; }
  .tag .why .unverified { color: var(--hanko); font-weight: 500; }
  .tag a {
    margin-top: auto; font: 500 12px var(--mono); color: var(--ink); text-decoration: none;
    border-top: 1px dashed #c9ced6; padding-top: 8px;
  }
  .tag a:hover { color: var(--hanko); }

  .empty { max-width: 520px; color: var(--muted); }
  .empty p { margin: 0 0 12px; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; }
  .examples button {
    background: var(--surface); color: var(--text); border: 1.5px dashed var(--line);
    border-radius: 8px; padding: 8px 12px; text-align: left; font-size: 13px;
  }
  .examples button:hover { border-color: var(--text); }

  @keyframes print { from { opacity: 0; transform: translateY(-6px); } }
  @keyframes hang { from { opacity: 0; transform: rotate(-7deg) translateY(-8px); } }
  @keyframes pulse { to { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }

  @media (max-width: 820px) {
    body { height: auto; }
    main { grid-template-columns: 1fr; }
    .chat { border-right: 0; border-bottom: 1px solid var(--line); }
    .log { max-height: 55vh; }
    header, .log, .composer, .board { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
<header>
  <h1 class="wordmark">listing<span>-</span>watcher</h1>
  <span class="status" id="status">connecting…</span>
  <button class="new-search" id="new" type="button">New search</button>
</header>
<main>
  <section class="chat" aria-label="Conversation">
    <div class="log" id="log" aria-live="polite"></div>
    <form class="composer" id="form">
      <textarea id="input" placeholder="What are you looking for? Name a site, a budget, must-haves." aria-label="Request"></textarea>
      <button type="submit" id="send">Send</button>
    </form>
  </section>
  <section class="board" aria-label="Agent work and results">
    <div class="receipt" aria-live="polite">
      <h2><span>Agent log</span><span id="steps-count">0 steps</span></h2>
      <ol id="feed"><li class="idle">Idle. Each step prints here while the agent works.</li></ol>
      <div class="total"><span>STATUS</span><span id="feed-status">waiting for a request</span></div>
    </div>
    <div>
      <div class="tags-head"><h2 id="tags-title">Results</h2></div>
      <div id="tags"></div>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), feed = $("feed"), tags = $("tags"), input = $("input");
const EXAMPLES = [
  "Used Sony WH-1000XM5 under ¥25,000 with the case included, on Mercari",
  "1K or 1LDK in Suita under ¥70,000 a month, 10 minutes from a station, on SUUMO",
  "Nintendo Switch OLED, working, with dock, under ¥28,000",
];
let ws, busy = false, steps = 0, retry = 500;

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
const safeUrl = (u) => (typeof u === "string" && /^https?:\/\//.test(u) ? u : null);
const yen = (p) => (p == null ? "?" : p.toLocaleString("ja-JP"));

function setBusy(b) {
  busy = b;
  input.disabled = $("send").disabled = $("new").disabled = b;
  $("status").textContent = b ? "working" : "ready";
  $("status").className = "status" + (b ? " busy" : "");
  $("feed-status").textContent = b ? "searching…" : steps ? "done" : "waiting for a request";
  if (!b) input.focus();
}

function addMessage(role, text, count) {
  const isError = role === "agent" && text.startsWith("error:");
  const m = el("div", `msg ${role}` + (isError ? " error" : ""));
  m.append(el("div", "who", role));
  m.append(el("p", "", isError
    ? "That didn't work: " + text.slice(6).trim() + "\nTry again in a minute, or send a follow-up."
    : text));
  if (count) m.append(el("div", "count", `${count} result${count > 1 ? "s" : ""} pinned on the right →`));
  log.append(m);
  log.scrollTop = log.scrollHeight;
}

function resetFeed() {
  steps = 0;
  feed.replaceChildren();
  $("steps-count").textContent = "0 steps";
}
function addStep(text) {
  if (steps === 0) feed.replaceChildren();
  steps += 1;
  feed.append(el("li", "", text));
  feed.scrollTop = feed.scrollHeight;
  $("steps-count").textContent = `${steps} step${steps > 1 ? "s" : ""}`;
}

function showEmpty() {
  $("tags-title").textContent = "Results";
  const box = el("div", "empty");
  box.append(el("p", "", "Ask for something and the agent will search, open the listings, and pin what fits here. Try one:"));
  const ex = el("div", "examples");
  for (const e of EXAMPLES) {
    const b = el("button", "", e);
    b.type = "button";
    b.onclick = () => { input.value = e; input.focus(); };
    ex.append(b);
  }
  box.append(ex);
  tags.className = "";
  tags.replaceChildren(box);
}

function showTags(listings) {
  if (!listings.length) return;
  $("tags-title").textContent = "Results · cheapest first";
  tags.className = "tags";
  tags.replaceChildren(...listings.map((l, i) => {
    const t = el("article", "tag");
    t.style.animationDelay = `${i * 70}ms`;
    t.append(el("div", "hanko", String(i + 1)));
    const photo = el("div", "photo", "no photo");
    const src = safeUrl(l.image_url);
    if (src) {
      const img = new Image();
      img.alt = l.title; img.loading = "lazy"; img.referrerPolicy = "no-referrer"; img.src = src;
      img.onerror = () => { photo.replaceChildren("no photo"); };
      photo.replaceChildren(img);
    }
    t.append(photo);
    if (i === 0 && l.price != null && listings.length > 1) t.append(el("span", "cheapest", "最安 cheapest"));
    const price = el("div", "price");
    price.append(el("small", "", "¥"), yen(l.price));
    t.append(price, el("h3", "title", l.title));
    const why = el("p", "why", l.why_matches);
    if (!l.verified) why.append(" ", el("span", "unverified", "(not opened)"));
    t.append(why);
    const href = safeUrl(l.url);
    if (href) {
      const a = el("a", "", "Open listing ↗");
      a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
      t.append(a);
    }
    return t;
  }));
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { retry = 500; };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "history") {
      log.replaceChildren(); showEmpty();
      if (!m.messages.length) addMessage("agent", "Tell me what you're looking for. I'll search, check the listings, and you can follow up: \"only ones with the case\", \"check #2's photos\".");
      for (const h of m.messages) {
        addMessage(h.role, h.text, h.listings.length);
        if (h.listings.length) showTags(h.listings);
      }
      resetFeed();
      if (m.steps.length) m.steps.forEach(addStep);
      else feed.append(el("li", "idle", "Idle. Each step prints here while the agent works."));
      setBusy(m.busy);
    } else if (m.type === "message") {
      addMessage("you", m.text); resetFeed(); setBusy(true);
    } else if (m.type === "step") {
      addStep(m.text);
    } else if (m.type === "reply") {
      addMessage("agent", m.text, m.listings.length);
      showTags(m.listings); setBusy(false);
    } else if (m.type === "busy") {
      $("feed-status").textContent = "still on the last request";
    } else if (m.type === "reset") {
      log.replaceChildren(); resetFeed(); showEmpty();
      feed.append(el("li", "idle", "New search. Each step prints here while the agent works."));
      addMessage("agent", "Started a new search. What are you looking for?");
      setBusy(false);
    }
  };
  ws.onclose = () => {
    $("status").textContent = "offline, reconnecting…";
    $("status").className = "status offline";
    setTimeout(connect, retry = Math.min(retry * 2, 8000));
  };
}

$("form").onsubmit = (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || busy || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: "ask", text }));
  input.value = "";
};
input.onkeydown = (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
};
$("new").onclick = () => ws && ws.readyState === WebSocket.OPEN && ws.send(JSON.stringify({ type: "new" }));

showEmpty();
connect();
</script>
</body>
</html>
